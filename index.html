<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gurukul Previous Year Papers</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root { --primary: #B85324; --bg: #f4f6f9; --text: #1e293b; --card-bg: #ffffff; }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
    .header { background: #0f172a; color: white; padding: 30px 20px; text-align: center; border-bottom: 5px solid var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .header h1 { margin: 0; font-size: 28px; }
    .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    
    .section-title { text-align: center; margin-bottom: 25px; color: #334155; font-weight: 600; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .card { background: var(--card-bg); border: 2px solid #e2e8f0; border-radius: 12px; padding: 25px 15px; text-align: center; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
    .card:hover, .card.active { border-color: var(--primary); background: #fff8f5; transform: translateY(-5px); }
    .card i { font-size: 35px; color: var(--primary); margin-bottom: 15px; }
    .card h3 { margin: 0; font-size: 17px; font-weight: 600; }

    /* Subject & Year Buttons */
    #subjectSelection, #yearSelection { display: none; margin-bottom: 40px; }
    
    .subject-btn { background: white; border: 2px solid #2563eb; color: #2563eb; padding: 10px 25px; margin: 8px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s ease; }
    .subject-btn:hover, .subject-btn.active-btn { background: #2563eb; color: white; }

    .year-btn { background: white; border: 2px solid var(--primary); color: var(--primary); padding: 10px 25px; margin: 8px; border-radius: 30px; font-weight: 600; font-size: 16px; cursor: pointer; transition: all 0.2s ease; }
    .year-btn:hover, .year-btn.active-btn { background: var(--primary); color: white; transform: scale(1.05); }

    /* Paper Viewer */
    #paperViewer { display: none; background: white; padding: 40px 50px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 50px; }
    #paperHeader { text-align: center; border-bottom: 2px dashed #cbd5e0; margin-bottom: 35px; padding-bottom: 20px; color: var(--primary); font-size: 24px; }
    
    .content-area { font-size: 17px; line-height: 1.9; color: #1e293b; }
    .content-area p { margin-bottom: 18px; text-align: justify; }
    .content-area strong { color: #000; font-weight: 700; }
    .content-area h3 { margin-top: 35px; margin-bottom: 15px; }
    .content-area ul, .content-area ol { padding-left: 25px; margin-bottom: 20px; }
    .marks-badge { float: right; color: #B85324; font-weight: 700; background: #fff5f0; padding: 2px 10px; border-radius: 4px; border: 1px solid #ffd6c4; font-size: 15px; margin-left: 10px; }
    #loading { text-align: center; display: none; font-size: 18px; color: var(--primary); font-weight: 500; margin: 40px 0;}
    
    @media (max-width: 768px) { #paperViewer { padding: 25px 20px; } .marks-badge { float: none; display: inline-block; margin-left: 5px; } }
  </style>
</head>
<body>

  <div class="header">
    <h1>Gurukul Exam Archive</h1>
    <p style="margin-top:8px; color:#94a3b8; font-size:15px; font-weight: 500;">Previous Years Board Question Papers</p>
  </div>

  <div class="container">
    <h3 class="section-title">1. Select Your Class</h3>
    <div class="grid" id="classGrid">
      <div class="card" onclick="selectClass('Class 5', this)"><i class="fas fa-school"></i><h3>Class 5</h3></div>
      <div class="card" onclick="selectClass('Class 8', this)"><i class="fas fa-book-reader"></i><h3>Class 8</h3></div>
      <div class="card" onclick="selectClass('Class 10', this)"><i class="fas fa-user-graduate"></i><h3>Class 10</h3></div>
      <div class="card" onclick="selectClass('12th Science', this)"><i class="fas fa-flask"></i><h3>12th Science</h3></div>
      <div class="card" onclick="selectClass('12th Arts', this)"><i class="fas fa-palette"></i><h3>12th Arts</h3></div>
    </div>

    <div id="loading"><i class="fas fa-spinner fa-spin"></i> Fetching Database...</div>

    <!-- NEW: Subject Selection -->
    <div id="subjectSelection">
      <h3 class="section-title">2. Select Subject</h3>
      <div id="subjectButtons" style="text-align: center;"></div>
    </div>

    <!-- Year Selection -->
    <div id="yearSelection">
      <h3 class="section-title">3. Select Year</h3>
      <div id="yearButtons" style="text-align: center;"></div>
    </div>

    <div id="paperViewer">
      <h2 id="paperHeader"></h2>
      <div id="paperContent" class="content-area"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzspLf1-S2T-xxom0uZ7Y_mdLPHAcEitO5gkyKrx5XtB2_XzrbvR8Qh5PnfJVMzNbaQ/exec"; // <--- UPDATE THIS
    
    let classPapers = [];
    
    function selectClass(className, element) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      element.classList.add('active');
      
      document.getElementById('subjectSelection').style.display = 'none';
      document.getElementById('yearSelection').style.display = 'none';
      document.getElementById('paperViewer').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_student_data', className: className }) })
      .then(res => res.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        classPapers = data;
        
        if(data.length === 0) {
          document.getElementById('subjectSelection').style.display = 'block';
          document.getElementById('subjectButtons').innerHTML = "<p style='color:#ef4444; font-weight:500;'>No papers available for this class yet.</p>";
        } else {
          // Extract Unique Subjects
          let subjects = [...new Set(data.map(p => p.subject))];
          let subHtml = '';
          subjects.forEach(sub => {
            subHtml += `<button class="subject-btn" onclick="selectSubject('${sub}', this)"><i class="fas fa-book"></i> ${sub}</button>`;
          });
          document.getElementById('subjectButtons').innerHTML = subHtml;
          document.getElementById('subjectSelection').style.display = 'block';
        }
      });
    }

    function selectSubject(subjectName, element) {
      document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active-btn'));
      element.classList.add('active-btn');
      
      document.getElementById('paperViewer').style.display = 'none';
      
      // Filter papers by selected subject
      let subjectData = classPapers.filter(p => p.subject === subjectName);
      
      let yearHtml = '';
      subjectData.forEach(p => {
        yearHtml += `<button class="year-btn" onclick="showPaper('${p.id}')">${p.year}</button>`;
      });
      document.getElementById('yearButtons').innerHTML = yearHtml;
      document.getElementById('yearSelection').style.display = 'block';
    }

    function showPaper(id) {
      document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active-btn'));
      event.target.classList.add('active-btn');

      const paper = classPapers.find(p => p.id === id);
      document.getElementById('paperHeader').innerText = `${paper.className} - ${paper.subject} (${paper.year})`;
      
      // Clean and format text (Same robust cleaner)
      let rawText = paper.content;
      rawText = rawText.replace(/span\s*_[a-zA-Z0-9_]+/gi, ''); 
      rawText = rawText.replace(/<[^>]*>/g, '');
      rawText = rawText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      rawText = rawText.replace(/([0-9]+\)|\b[0-9]+\.)/g, '<br><br><strong>$1</strong>');
      rawText = rawText.replace(/(\[[0-9+=\/ ]+\])/g, '<span class="marks-badge">$1</span>');
      rawText = rawText.replace(/(खण्ड[\s-]*[0-9]+|Section[\s-]*[A-Z0-9]+)/gi, '<br><br><h3 style="color:#0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom:8px; text-transform:uppercase;">$1</h3>');
      rawText = rawText.replace(/(\nअथवा\n|\nOR\n|\sअथवा\s|\sOR\s)/gi, '<br><br><div style="text-align:center; font-weight:600; font-style:italic; color:#64748b; margin: 20px 0;">--- अथवा ---</div><br>');

      const formattedHtml = marked.parse(rawText);
      document.getElementById('paperContent').innerHTML = formattedHtml;
      
      document.getElementById('paperViewer').style.display = 'block';
      setTimeout(() => { document.getElementById('paperViewer').scrollIntoView({behavior: "smooth", block: "start"}); }, 100);
    }
  </script>
</body>
</html>
