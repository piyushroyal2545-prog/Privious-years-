<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gurukul Previous Year Papers</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- Markdown Parser Library (For Auto-formatting) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root { --primary: #B85324; --bg: #f8fafc; --text: #1e293b; }
    body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
    
    .header { background: #0f172a; color: white; padding: 25px 20px; text-align: center; border-bottom: 5px solid var(--primary); }
    .header h1 { margin: 0; font-size: 24px; }
    
    .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    
    /* Selection Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .card { background: white; border: 2px solid #e2e8f0; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .card:hover, .card.active { border-color: var(--primary); background: #fff5f0; transform: translateY(-3px); }
    .card i { font-size: 30px; color: var(--primary); margin-bottom: 10px; }
    .card h3 { margin: 0; font-size: 16px; }

    /* Years List */
    #yearSelection { display: none; margin-bottom: 30px; }
    .year-btn { background: white; border: 1px solid var(--primary); color: var(--primary); padding: 10px 20px; margin: 5px; border-radius: 20px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .year-btn:hover { background: var(--primary); color: white; }

    /* Paper Viewer */
    #paperViewer { display: none; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    #paperHeader { text-align: center; border-bottom: 2px dashed #cbd5e0; margin-bottom: 25px; padding-bottom: 15px; color: var(--primary); }
    
    /* Magic Markdown Styling */
    .content-area { font-size: 16px; line-height: 1.8; color: #334155; }
    .content-area p { margin-bottom: 15px; }
    .content-area strong { color: #0f172a; }
    .content-area ul, .content-area ol { padding-left: 20px; margin-bottom: 15px; }
    
    #loading { text-align: center; display: none; font-size: 18px; color: var(--primary); }
  </style>
</head>
<body>

  <div class="header">
    <h1>Gurukul Exam Archive</h1>
    <p style="margin-top:5px; color:#94a3b8; font-size:14px;">Previous Years Board Question Papers</p>
  </div>

  <div class="container">
    <h3 style="text-align: center; margin-bottom: 20px;">1. Select Your Class</h3>
    <div class="grid" id="classGrid">
      <div class="card" onclick="selectClass('Class 5', this)"><i class="fas fa-school"></i><h3>Class 5</h3></div>
      <div class="card" onclick="selectClass('Class 8', this)"><i class="fas fa-book-reader"></i><h3>Class 8</h3></div>
      <div class="card" onclick="selectClass('Class 10', this)"><i class="fas fa-user-graduate"></i><h3>Class 10</h3></div>
      <div class="card" onclick="selectClass('12th Science', this)"><i class="fas fa-flask"></i><h3>12th Science</h3></div>
      <div class="card" onclick="selectClass('12th Arts', this)"><i class="fas fa-palette"></i><h3>12th Arts</h3></div>
    </div>

    <div id="loading"><i class="fas fa-spinner fa-spin"></i> Fetching Papers...</div>

    <div id="yearSelection">
      <h3 style="text-align: center; margin-bottom: 15px;">2. Select Year</h3>
      <div id="yearButtons" style="text-align: center;"></div>
    </div>

    <div id="paperViewer">
      <h2 id="paperHeader"></h2>
      <div id="paperContent" class="content-area"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzspLf1-S2T-xxom0uZ7Y_mdLPHAcEitO5gkyKrx5XtB2_XzrbvR8Qh5PnfJVMzNbaQ/exec"; // <--- UPDATE THIS
    let allPapers = [];

    function selectClass(className, element) {
      // Highlight selection
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      element.classList.add('active');
      
      // Hide Viewer, Show Loading
      document.getElementById('paperViewer').style.display = 'none';
      document.getElementById('yearSelection').style.display = 'none';
      document.getElementById('loading').style.display = 'block';

      // Fetch data
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_student_data', className: className }) })
      .then(res => res.json())
      .then(data => {
        document.getElementById('loading').style.display = 'none';
        allPapers = data;
        
        if(data.length === 0) {
          document.getElementById('yearButtons').innerHTML = "<p style='color:red;'>No papers available for this class yet.</p>";
        } else {
          let yearHtml = '';
          data.forEach((p, index) => {
            yearHtml += `<button class="year-btn" onclick="showPaper(${index})">${p.year}</button>`;
          });
          document.getElementById('yearButtons').innerHTML = yearHtml;
        }
        document.getElementById('yearSelection').style.display = 'block';
      });
    }

    function showPaper(index) {
      const paper = allPapers[index];
      document.getElementById('paperHeader').innerText = `${paper.className} - Board Exam ${paper.year}`;
      
      // Magic: Convert raw text from Gemini into beautiful HTML format
      const formattedHtml = marked.parse(paper.content);
      document.getElementById('paperContent').innerHTML = formattedHtml;
      
      document.getElementById('paperViewer').style.display = 'block';
      
      // Scroll to paper
      document.getElementById('paperViewer').scrollIntoView({behavior: "smooth"});
    }
  </script>
</body>
  </html>
