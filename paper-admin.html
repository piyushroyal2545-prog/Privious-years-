<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gurukul Paper Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { background: #f4f6f9; font-family: 'Poppins', sans-serif; padding: 20px; }
    .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #1e293b; border-bottom: 2px solid #B85324; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: 600; font-size: 14px; color: #334155; }
    select, input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 8px; margin-top: 5px; font-family: inherit; }
    textarea { height: 250px; resize: vertical; }
    .btn { background: #B85324; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .btn-delete { background: #ef4444; padding: 6px 10px; color: white; border: none; border-radius: 5px; cursor: pointer;}
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
    th { background: #0f172a; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h2><i class="fas fa-upload"></i> Upload Previous Year Paper</h2>
    
    <div class="form-group">
      <label>Select Class</label>
      <select id="className">
        <option value="Class 5">Class 5</option>
        <option value="Class 8">Class 8</option>
        <option value="Class 10">Class 10</option>
        <option value="12th Science">12th Science</option>
        <option value="12th Arts">12th Arts</option>
      </select>
    </div>

    <!-- NAYA: Subject Selection -->
    <div class="form-group">
      <label>Select Subject</label>
      <select id="subject">
        <option value="Hindi">Hindi (हिंदी)</option>
        <option value="English">English</option>
        <option value="Mathematics">Mathematics (गणित)</option>
        <option value="Science">Science (विज्ञान)</option>
        <option value="Social Science">Social Science (सामाजिक विज्ञान)</option>
        <option value="Sanskrit">Sanskrit (संस्कृत)</option>
        <option value="Physics">Physics (भौतिक विज्ञान)</option>
        <option value="Chemistry">Chemistry (रसायन विज्ञान)</option>
        <option value="Biology">Biology (जीव विज्ञान)</option>
        <option value="Geography">Geography (भूगोल)</option>
        <option value="History">History (इतिहास)</option>
        <option value="Political Science">Political Science</option>
        <option value="Drawing">Drawing (चित्रकला)</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>Exam Year (e.g., 2024)</label>
      <input type="number" id="year" value="2020" min="2015" max="2035">
    </div>

    <div class="form-group">
      <label>Paste Clean Text Here</label>
      <textarea id="content" placeholder="Paste the paper text here..."></textarea>
    </div>

    <button class="btn" onclick="savePaper()"><i class="fas fa-save"></i> Save Paper</button>

    <h3 style="margin-top:40px;">Manage Uploaded Papers</h3>
    <table>
      <thead><tr><th>Class</th><th>Subject</th><th>Year</th><th>Action</th></tr></thead>
      <tbody id="paperList"></tbody>
    </table>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzspLf1-S2T-xxom0uZ7Y_mdLPHAcEitO5gkyKrx5XtB2_XzrbvR8Qh5PnfJVMzNbaQ/exec"; // <--- UPDATE THIS

    window.onload = loadPapers;

    function savePaper() {
      const btn = document.querySelector('.btn');
      btn.innerHTML = "Saving...";
      const data = {
        action: 'save_paper',
        className: document.getElementById('className').value,
        subject: document.getElementById('subject').value,
        year: document.getElementById('year').value,
        content: document.getElementById('content').value
      };

      fetch(API_URL, { method: 'POST', body: JSON.stringify(data) })
      .then(res => res.json())
      .then(res => {
        alert("Paper saved successfully!");
        document.getElementById('content').value = "";
        btn.innerHTML = '<i class="fas fa-save"></i> Save Paper';
        loadPapers();
      });
    }

    function loadPapers() {
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'get_all_papers' }) })
      .then(res => res.json())
      .then(data => {
        let html = '';
        data.forEach(p => {
          html += `<tr>
            <td>${p.className}</td>
            <td><b>${p.subject}</b></td>
            <td>${p.year}</td>
            <td><button class="btn-delete" onclick="deletePaper('${p.id}')">Delete</button></td>
          </tr>`;
        });
        document.getElementById('paperList').innerHTML = html;
      });
    }

    function deletePaper(id) {
      if(confirm("Are you sure?")) {
        fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_paper', id: id }) })
        .then(() => loadPapers());
      }
    }
  </script>
</body>
</html>
